plugins {
    id "dev.architectury.loom" version "1.10.433"
    id "architectury-plugin"
    id "com.gradleup.shadow" version "9.6.1"
    id "me.shedaniel.unified-publishing"
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/cadeditor.accesswidener")

    runs {
        client {
            vmArg "-Dfile.encoding=UTF-8"
            vmArg "-Dsun.stdout.encoding=UTF-8"
            vmArg "-Dsun.stderr.encoding=UTF-8"
        }
        server {
            vmArg "-Dfile.encoding=UTF-8"
            vmArg "-Dsun.stdout.encoding=UTF-8"
            vmArg "-Dsun.stderr.encoding=UTF-8"
        }
    }
}

repositories {
    maven { url = uri("https://maven.neoforged.net/releases/") }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    create('common')
    create('shadowCommon')
}

configurations.compileClasspath.extendsFrom(configurations.common)
configurations.runtimeClasspath.extendsFrom(configurations.common)

if (configurations.findByName('developmentNeoForge') != null) {
    configurations.developmentNeoForge.extendsFrom(configurations.common)
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
    compileOnly "org.jetbrains:annotations:24.1.0"
}

processResources {
    from(project(":common").file("src/main/resources")) {
        include "cadeditor.accesswidener"
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/ATTRIBUTION.txt'
}

shadowJar {
    exclude "fabric.mod.json"
    def sc = project.configurations.findByName('shadowCommon')
    if (sc != null) {
        configurations = [sc]
    } else {
        configurations = []
    }

    archiveClassifier = "dev-shadow"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "neoforge"

    from(rootProject.file('LICENSE')) { into 'META-INF' }
    from(rootProject.file('ATTRIBUTION.txt')) { into 'META-INF' }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    archiveClassifier = "dev"
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }

afterEvaluate {
    def aw = project(":common").file("src/main/resources/cadeditor.accesswidener")
    if (!aw.exists()) {
        logger.warn("Warning: accesswidener file missing at " + aw.path + " — runtime may fail with 'Missing accessWidener file' error.")
    }
}

// ============ Lite server-slim build ============
// Excludes the client-side animated ItemStackMixin (core logic for rainbow name / Infinite rainbow display),
// and replaces the mixin config with a slim config that does not include that mixin.
// The Lite build only loads the basic NBT editor UI when used on a client, with no custom dynamic effects,
// to prevent unfamiliar admins from stealing custom effects.
tasks.register('serverOnlyJar', Zip) {
    dependsOn remapJar
    archiveClassifier = 'neoforge-lite'
    archiveExtension = 'jar'
    destinationDirectory = layout.buildDirectory.dir('libs')

    from(zipTree(remapJar.archiveFile)) {
        exclude 'com/github/rinorsi/cadeditor/mixin/ItemStackMixin*.class'
        exclude 'cadeditor-common.mixins.json'
    }
    from(project(':common').file('src/main/resources/cadeditor-common-serveronly.mixins.json')) {
        rename { 'cadeditor-common.mixins.json' }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ============ Visual-only client mod build ============
// Pure client-side visual mod containing only the OP sword rainbow effect.
// Reuses the existing RainbowNameHandler and ItemStackMixin from the main project,
// adds a lightweight entrypoint that only calls onClientTick, and replaces mod metadata.
// Contains ZERO CAD editor functions — no network, no permission, no NBT editing code.

sourceSets {
    visual {
        java {
            srcDir 'visual-src/java'
        }
        resources {
            srcDir 'visual-src/resources'
        }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('compileVisualJava') {
    options.encoding = "UTF-8"
    options.release = 21
    classpath = sourceSets.main.compileClasspath + sourceSets.visual.compileClasspath
}

tasks.register('visualJar', Jar) { t ->
    dependsOn compileVisualJava, processVisualResources, remapJar
    archiveClassifier = 'neoforge-visual'
    destinationDirectory = layout.buildDirectory.dir('libs')

    from(sourceSets.visual.output.classesDirs)
    from(file("visual-src/resources"))

    from(zipTree(remapJar.archiveFile)) {
        include 'com/github/rinorsi/cadeditor/client/RainbowNameHandler*.class'
        include 'com/github/rinorsi/cadeditor/mixin/ItemStackMixin*.class'
    }

    // 只排除 LICENSE/README 等无关文件；绝不能排除我们 visual-src/resources 里的 mods.toml/neoforge.mods.toml
    exclude 'META-INF/LICENSE'
    exclude 'META-INF/LICENSE.txt'
    exclude 'META-INF/NOTICE'
    exclude 'META-INF/NOTICE.txt'
    exclude 'META-INF/ATTRIBUTION.txt'
    exclude 'META-INF/README.md'
    exclude 'META-INF/cadeditor.accesswidener'
    exclude 'META-INF/accesstransformer.cfg'

    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Implementation-Title': 'opswordvisual',
            'Implementation-Version': '1.0.0',
            'Implementation-Vendor': 'opswordvisual',
            'MixinConfigs': 'opswordvisual.mixins.json',
            'MixinVersion': '0.8.7'
        )
    }

    t.doLast { task ->
        def jarFile = task.archiveFile.get().asFile
        def mfText = "Manifest-Version: 1.0\r\n" +
                     "Implementation-Title: opswordvisual\r\n" +
                     "Implementation-Version: 1.0.0\r\n" +
                     "Implementation-Vendor: opswordvisual\r\n" +
                     "MixinConfigs: opswordvisual.mixins.json\r\n" +
                     "MixinVersion: 0.8.7\r\n\r\n"
        def mfBytes = mfText.getBytes("UTF-8")
        def tempFile = new File(jarFile.parentFile, jarFile.name + ".tmp")
        def buffer = new byte[65536]
        def zos = null
        def zis = null
        try {
            zos = new java.util.zip.ZipOutputStream(new FileOutputStream(tempFile))
            zis = new java.util.zip.ZipFile(jarFile)
            def entries = zis.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.getName().equals("META-INF/MANIFEST.MF")) {
                    def newEntry = new java.util.zip.ZipEntry("META-INF/MANIFEST.MF")
                    zos.putNextEntry(newEntry)
                    zos.write(mfBytes)
                    zos.closeEntry()
                } else {
                    def newEntry = new java.util.zip.ZipEntry(entry.getName())
                    zos.putNextEntry(newEntry)
                    def input = zis.getInputStream(entry)
                    int len
                    while ((len = input.read(buffer)) > 0) {
                        zos.write(buffer, 0, len)
                    }
                    input.close()
                    zos.closeEntry()
                }
            }
        } finally {
            if (zis != null) zis.close()
            if (zos != null) zos.close()
        }
        jarFile.delete()
        tempFile.renameTo(jarFile)
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The build task also produces the full and Lite variants together
tasks.named('build') {
    dependsOn serverOnlyJar, visualJar
}
